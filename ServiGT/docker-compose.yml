version: "3.8"

services:
  #PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: pservicios_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pservicios
      POSTGRES_USER: pservicios_user
      POSTGRES_PASSWORD: pservicios_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pservicios_user -d pservicios"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis
  redis:
    image: redis:7-alpine
    container_name: pservicios_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Backend Laravel
  backend:
    build:
      context: ./backend
    container_name: pservicios_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    environment:
      APP_NAME: PServicios
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: pservicios
      DB_USERNAME: pservicios_user
      DB_PASSWORD: pservicios_secret

      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Frontend (Expo)
  frontend:
    build:
      context: ./frontend
    container_name: pservicios_frontend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./frontend:/app
    environment:
      EXPO_PUBLIC_API_URL: http://backend:8000/api
    depends_on:
      - backend

volumes:
  pgdata: