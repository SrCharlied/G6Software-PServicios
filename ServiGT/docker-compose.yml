services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: servigt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: servigt
      POSTGRES_USER: servigt_user
      POSTGRES_PASSWORD: servigt_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servigt_user -d servigt"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servigt_backend
    restart: unless-stopped
    ports:
      - "8180:8000"
    environment:
      APP_NAME: ServiGT
      APP_ENV: local
      APP_KEY: base64:xR3TbPNBfz4mGU5MhKtp3HKDO+jMnaSj6UEahGkAjQo=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: servigt
      DB_USERNAME: servigt_user
      DB_PASSWORD: servigt_secret
    depends_on:
      db:
        condition: service_healthy

  # Frontend Expo Web
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: servigt_frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  pgdata:
