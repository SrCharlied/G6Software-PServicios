services:
  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: servigt_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pservicios}
      POSTGRES_USER: ${DB_USERNAME:-pservicios_user}
      # Sin valor por defecto a proposito (task 4.1). Se deja vacio en vez de
      # usar `:?` porque Compose interpola el archivo completo aunque solo se
      # invoque el perfil `test`, y un `:?` aqui tumbaria la suite del CI, que
      # no usa este servicio. Postgres rechaza arrancar con contrasena vacia,
      # asi que el fallo sigue siendo inmediato y explicito.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
    # Sin binding al host — solo accesible desde la red interna de Docker
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # El esquema NO se monta en /docker-entrypoint-initdb.d: eso solo corre
      # con el volumen vacio y hacia que una BD ya existente nunca recibiera
      # las tablas nuevas. Lo aplica el backend en cada arranque.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-pservicios_user} -d ${DB_DATABASE:-pservicios}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - servigt_net

  # Backend Laravel
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: servigt_backend
    restart: unless-stopped
    ports:
      - "8085:8000"
    environment:
      APP_NAME: ServiGT
      APP_ENV: ${APP_ENV:-local}
      # APP_KEY, DB_PASSWORD y ADMIN_PASSWORD no traen valor (task 4.1): salen
      # del archivo ServiGT/.env, que no esta en el repositorio. El entrypoint
      # aborta el arranque si alguna llega vacia, asi que no existe un secreto
      # comiteado que sirva en la maquina de cualquiera. Ver ServiGT/.env.example.
      APP_KEY: ${APP_KEY:-}
      # Debug apagado salvo que el ambiente lo pida: con debug encendido una
      # excepcion no controlada entrega stack trace, SQL y rutas del servidor.
      APP_DEBUG: ${APP_DEBUG:-false}
      # Debe coincidir con el puerto publico para que Sanctum y los enlaces de storage funcionen
      APP_URL: ${APP_URL:-http://localhost:8085}
      # Origenes permitidos por CORS. Vacio = sin cross-origin fuera de local.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-pservicios}
      DB_USERNAME: ${DB_USERNAME:-pservicios_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      # Cuenta de administrador. Obligatoria y nunca impresa por el entrypoint.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@servigt.gt}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Datos demo: activos solo si el ambiente lo pide explicitamente.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PROVIDER_SEED_PASSWORD: ${PROVIDER_SEED_PASSWORD:-}
    volumes:
      # Persistir fotos publicas entre rebuilds
      - backend_storage:/app/storage/app/public
      # Documentos de identidad: disco privado (Laravel 11 'local'), nunca
      # servido por /storage. Se persiste por separado para que sobreviva rebuild.
      - backend_private_storage:/app/storage/app/private
      # Fuente unica del esquema. sync_schema.php lo aplica en cada arranque
      # de forma idempotente, asi converge cualquier BD sin borrar datos.
      # Se monta el DIRECTORIO, no el archivo: al montar un archivo suelto el
      # bind queda atado a su inode, y los editores que guardan escribiendo un
      # temporal y renombrando dejan al contenedor leyendo la version vieja.
      - ./database:/app/database:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - servigt_net

  # Frontend Expo Web — desarrollo (Metro con hot reload)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
      args:
        # URL publica del backend que se inyecta al bundle web en build-time.
        # Sobreescribir en el server con un archivo .env junto a este docker-compose.yml
        # Ejemplo: PUBLIC_API_URL=http://www.servigtdev.com:8085/api
        EXPO_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8085/api}
    container_name: servigt_frontend
    restart: unless-stopped
    ports:
      - "8086:8081"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - servigt_net

  # Frontend productivo — export estatico servido por Nginx (task 4.2).
  #
  # Vive en el perfil `prod` para no reemplazar el hot reload de desarrollo:
  # `docker compose up` sigue levantando Metro; este target solo arranca con
  # `docker compose --profile prod up frontend_prod`.
  #
  # No recibe `EXPO_PUBLIC_API_URL` a proposito: el Dockerfile usa `/api`, que
  # es relativo, y Nginx hace proxy del API en el mismo origen. Asi el uso
  # normal de la app no depende de CORS.
  frontend_prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    container_name: servigt_frontend_prod
    restart: unless-stopped
    ports:
      - "8087:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - servigt_net

  # PostgreSQL temporal y aislado para las pruebas automatizadas del backend.
  db_test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      # Credenciales literales a proposito: esta base vive en tmpfs, no expone
      # puertos, se destruye al terminar la suite y nunca contiene datos reales.
      # No comparte contrasena con `db` para que filtrarla no sirva de nada.
      POSTGRES_DB: pservicios_test
      POSTGRES_USER: pservicios_test_user
      POSTGRES_PASSWORD: solo-para-la-suite-efimera
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pservicios_test_user -d pservicios_test"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - servigt_net

  backend_test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin `command:` corre la suite completa (tests/Unit + tests/Feature).
    # Para una sola clase: docker compose --profile test run --rm backend_test tests/Feature/CreditosYAceptacionTest.php
    entrypoint: ["php", "artisan", "test"]
    environment:
      APP_ENV: testing
      # Clave efimera exclusiva de la suite, distinta de la de `backend`: no
      # descifra nada fuera de esta base en tmpfs.
      APP_KEY: base64:5vYQ1nT0kZP3sB8xW2eR7uK4mJ6hG9dC1aN5fL0iO8s=
      # Debug apagado tambien aqui, para que las pruebas de la task 4.3 midan el
      # mismo manejo de errores que corre en el ambiente real.
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db_test
      DB_PORT: 5432
      DB_DATABASE: pservicios_test
      DB_USERNAME: pservicios_test_user
      DB_PASSWORD: solo-para-la-suite-efimera
      CACHE_STORE: array
      SESSION_DRIVER: array
    volumes:
      - ./backend/tests:/app/tests:ro
    depends_on:
      db_test:
        condition: service_healthy
    networks:
      - servigt_net

volumes:
  pgdata:
  backend_storage:
  backend_private_storage:

networks:
  servigt_net:
    driver: bridge
