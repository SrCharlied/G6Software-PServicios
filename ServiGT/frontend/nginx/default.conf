# Servidor web del export estatico de Expo (task 4.2).
#
# Sustituye a Metro en produccion: Metro es un dev server que sirve el bundle
# sin comprimir y expone el mecanismo de hot reload. Aqui solo salen archivos
# ya compilados, y el API viaja por el mismo origen para que el navegador no
# tenga que hacer preflight de CORS en el uso normal de la aplicacion.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la version exacta de Nginx en cada respuesta ni en las
    # paginas de error.
    server_tokens off;

    # Subidas de documentos y portadas: el backend acepta hasta 6 MB, asi que
    # el limite de Nginx tiene que ser mayor o el 413 llegaria antes de que el
    # backend pudiera dar su mensaje de validacion.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad. Ver nginx/security-headers.conf: hay que
    # repetir el include en cada location que declare `add_header` propio,
    # porque `add_header` no se hereda.
    include /etc/nginx/snippets/security-headers.conf;

    # ── API ───────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos de perfil y portadas. Son el disco publico de Laravel; los
    # documentos de identidad NO pasan por aqui: viven en el disco privado y
    # solo salen por la ruta autenticada de descarga (task 2.2).
    location /storage/ {
        proxy_pass http://backend:8000/storage/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un archivo subido nunca debe interpretarse como HTML. Aqui la CSP es
        # mas estricta que la del resto del sitio: el contenido lo subio un
        # usuario, asi que no debe poder ejecutar nada.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox" always;
    }

    # ── Estaticos ─────────────────────────────────────────────────────────
    #
    # El bundle lleva hash en el nombre, asi que se puede cachear de forma
    # agresiva: un deploy nuevo cambia el nombre del archivo.
    location /_expo/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # `index.html` no se cachea: es lo que apunta al bundle con hash, y
    # cachearlo dejaria a los navegadores pidiendo un bundle que ya no existe.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Expo Router usa rutas del lado del cliente: cualquier ruta desconocida
    # devuelve index.html para que el router la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
