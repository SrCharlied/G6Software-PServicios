# Cabeceras de seguridad compartidas (task 4.2).
#
# POR QUE ESTO ES UN INCLUDE Y NO ESTA SOLO EN EL BLOQUE `server`
# ---------------------------------------------------------------
# `add_header` NO se hereda: en cuanto un `location` declara su propio
# `add_header` (por ejemplo para Cache-Control), Nginx descarta todas las
# cabeceras del nivel superior en ese location. Ponerlas solo en `server`
# dejaria `index.html`, `/_expo/` y `/assets/` sin CSP —justo el documento
# principal y el bundle—. Este archivo se incluye en cada location que agrega
# cabeceras propias.
#
# `always` hace que tambien salgan en respuestas 4xx/5xx, que es donde a un
# atacante le conviene que falten.

# CSP — por que cada directiva es la que es:
#  - `script-src 'self'`: el export de Expo no lleva scripts inline, asi que no
#    hacen falta 'unsafe-inline' ni nonces. Esta es la linea que convierte un
#    XSS en algo mucho mas dificil de explotar, y es la mitigacion que
#    `src/services/storage.js` da por supuesta para el bearer en web.
#  - `style-src` si necesita 'unsafe-inline': react-native-web inyecta las hojas
#    de estilo en tiempo de ejecucion. Quitarlo rompe toda la UI.
#  - `connect-src 'self'`: el API es relativo (/api), asi que no hay ningun host
#    externo legitimo al que la app deba conectarse.
#  - `frame-ancestors 'none'`: nadie puede embeber la app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# Se conserva ademas de frame-ancestors para navegadores viejos.
add_header X-Frame-Options "DENY" always;

# Impide que el navegador adivine el tipo de un archivo y lo ejecute como HTML
# o JavaScript.
add_header X-Content-Type-Options "nosniff" always;

# No filtrar la ruta interna que veia el usuario al navegar a otro sitio.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# La app no usa camara, microfono, ubicacion ni pagos del navegador.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Aislamiento de origen. ZAP Baseline los reporta como WARN 90004 y el coste de
# ponerlos aqui es nulo: la CSP ya restringe todo a 'self', asi que no hay
# ningun subrecurso cross-origin que COEP pueda romper.
#  - COOP corta la referencia `window.opener` desde una pestana abierta por la
#    app, que es el vector de tabnabbing.
#  - CORP impide que otro sitio embeba estos recursos.
#  - COEP exige que cualquier subrecurso declare que acepta ser embebido.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
